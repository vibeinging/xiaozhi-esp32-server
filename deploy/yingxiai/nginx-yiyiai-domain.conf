server {
    listen 80;
    server_name yiyiai.mediaprogram.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name yiyiai.mediaprogram.cn;

    ssl_certificate /etc/letsencrypt/live/yiyiai.mediaprogram.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yiyiai.mediaprogram.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 6m;

    location /xiaozhi/v1/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $yingxiai_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /xiaozhi/ota/ {
        proxy_pass http://127.0.0.1:18002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /mcp/vision/explain {
        proxy_pass http://127.0.0.1:18103;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 固件的独立资源分区更新文件，例如自定义唤醒词模型。
    # 不开放目录浏览，只允许通过明确文件名下载。
    location ^~ /xiaozhi/assets/ {
        alias /opt/yingxiai/shared/assets/;
        default_type application/octet-stream;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 智控台 API：登录、验证码等少数接口由应用允许匿名访问，
    # 模型、设备和系统配置接口由应用的 token 和超级管理员权限保护。
    location ^~ /xiaozhi/ {
        proxy_pass http://127.0.0.1:18002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 智控台网页。
    location / {
        root /opt/yingxiai/runtime/manager-web-yiyiai-stability-v12;
        try_files $uri $uri/ /index.html;
    }
}
